services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # localhost — Caddy auto-generates a cert via its internal CA.
      # Run `docker compose exec caddy caddy trust` once to add the CA to your
      # system trust store so browsers don't show a certificate warning.
      - DOMAIN=localhost
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  frontend:
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./web
          target: /src/web
          ignore:
            - node_modules/
        - action: rebuild
          path: package.json
    build:
      context: .
      dockerfile: ./app/frontend/Dockerfile
      target: prod
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    image: ohm-demo-frontend:${VERSION:-latest}
    env_file:
      - path: ./app/frontend/.env.local
        required: true
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
    # Port 3000 is intentionally NOT published — Caddy is the entry point.
    # Uncomment to access the frontend directly without Caddy:
    # ports:
    #   - "3000:3000"
    depends_on:
      - backend
  
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
      target: prod
    image: ohm-demo-backend:${VERSION:-latest}
    env_file:
      - path: ./app/backend/.env.local
        required: true
    environment:
      # Override localhost values in .env.local with Docker service names
      - DB_HOST=OperaClone2-db
      - EXTERNAL_CLIENT_BASE_URL=http://mock-api:8000
      # Allow requests from Caddy-served localhost (https) and plain http for
      # direct access. ${DOMAIN} comes from root .env (defaults to localhost).
      - CORS_ORIGINS=https://${DOMAIN:-localhost},http://${DOMAIN:-localhost}
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/app/backend/data
    depends_on:
      mock-api:
        condition: service_started
      db:
        condition: service_healthy
  
  mock-api: &mock-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./app/mock-api/Dockerfile
      target: prod
    image: ohm-demo-mock-api:${VERSION:-latest}
    env_file:
      - path: ./app/mock-api/.env.local
        required: true
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    environment:
      # Override localhost value in .env.local with Docker service name
      OPERACLONE2_DB_HOST: OperaClone2-db
    ports:
      - "8000:8000"

  db:
    restart: unless-stopped
    image: postgres:18.1-bookworm
    hostname: OperaClone2-db
    environment:
      POSTGRES_PASSWORD: "OperaClone2"
      POSTGRES_USER: "OperaClone2"
      POSTGRES_DB: "OperaClone2"
    ports:
      - "5432:5432"
    volumes:
      - OperaClone2-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U OperaClone2"]
      interval: 2s
      timeout: 3s
      retries: 40

  migrator:
    <<: *mock-api
    restart: "no"
    ports: []
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy



volumes:
  OperaClone2-db-data:
    name: OperaClone2-db-data
  backend-data:
    name: backend-data
  caddy_data:
    name: ohm-demo-caddy-data-local
  caddy_config:
    name: ohm-demo-caddy-config-local
