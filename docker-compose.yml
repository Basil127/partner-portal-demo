services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # Both values come from the root .env file (see .env.example).
      # Docker Compose substitutes ${DOMAIN} and ${ACME_EMAIL} automatically.
      - DOMAIN=${DOMAIN:-localhost}
      - ACME_EMAIL=${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # stores TLS certs — must survive re-deploys
      - caddy_config:/config  # Caddy config cache
    depends_on:
      - frontend

  frontend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./app/frontend/Dockerfile
      target: prod
      args:
        # Empty string causes the frontend to use relative URLs (/api/*),
        # which the Next.js rewrite proxy forwards to the backend internally.
        # Override only if you need the browser to call the backend directly.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    image: ohm-demo-frontend:${VERSION:-latest}
    env_file:
      - path: ./app/frontend/.env.production
        required: true
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Exposes the public domain to the Next.js app (e.g. for allowed origins,
      # canonical URLs). Sourced from the root .env file.
      - NEXT_PUBLIC_DOMAIN=${DOMAIN:-localhost}
    # Port 3000 is intentionally NOT published here — Caddy is the only
    # public entry point. Remove the comment below to expose it directly
    # for local debugging: ports: ["3000:3000"]
    depends_on:
      - backend
  
  backend:
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./app/backend/Dockerfile
      target: prod
    image: ohm-demo-backend:${VERSION:-latest}
    env_file:
      - path: ./app/backend/.env.production
        required: true
    environment:
      # Allow requests from the public domain served by Caddy.
      # ${DOMAIN} is substituted from the root .env file.
      - CORS_ORIGINS=https://${DOMAIN:-localhost}
    ports:
      - "3001:3001"
    volumes:
      - backend-data:/app/app/backend/data
    depends_on:
      - mock-api
      - db
  
  mock-api: &mock-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: ./app/mock-api/Dockerfile
      target: prod
    image: ohm-demo-mock-api:${VERSION:-latest}
    env_file:
      - path: ./app/mock-api/.env.production
        required: true
    depends_on:
      db:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

  db:
    restart: unless-stopped
    image: postgres:18.1-bookworm
    hostname: OperaClone2-db
    environment:
      POSTGRES_PASSWORD: "OperaClone2"
      POSTGRES_USER: "OperaClone2"
      POSTGRES_DB: "OperaClone2"
    ports:
      - "5432:5432"
    volumes:
      - OperaClone2-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U OperaClone2"]
      interval: 2s
      timeout: 3s
      retries: 40

  migrator:
    <<: *mock-api
    restart: "no"
    ports: []
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy


volumes:
  OperaClone2-db-data:
    name: OperaClone2-db-data
  backend-data:
    name: backend-data
  caddy_data:
    name: ohm-demo-caddy-data   # persists TLS certificates across re-deploys
  caddy_config:
    name: ohm-demo-caddy-config
